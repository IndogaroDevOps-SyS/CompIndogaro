name: Build Pangkas Host APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        run: gradle wrapper

      - name: Build APK Release
        run: ./gradlew assembleRelease --no-daemon

      - name: Generate Keystore & Sign APK
        run: |
          mkdir -p $HOME/.android
          keytool -genkey -v -keystore $HOME/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          
          APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks $HOME/.android/debug.keystore --ks-pass pass:android --key-pass pass:android --out app/build/outputs/apk/release/PangkasHost-Signed.apk $APK_PATH

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PangkasHost-Signed
          path: app/build/outputs/apk/release/PangkasHost-Signed.apk
